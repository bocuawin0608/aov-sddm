[General]
# Background settings
# backgroundType can be "video" or "image"
backgroundType=video
# Video background source:
# - Can be relative path (e.g. assets/backgrounds/default.mp4)
# - Can be a file name inside assets/backgrounds/ (e.g. my_video.mp4)
# - Can be an absolute path (e.g. /home/user/Videos/bg.mp4)
# Or use helper script: ./set-video.sh <path_to_video>
videoBackground=assets/backgrounds/sddm_theme.mp4
# background=assets/backgrounds/default.png
dimOverlay=0.20
enableParallax=true
reducedMotion=false

# Virtual keyboard setting (auto popup suppressed by default)
enableVirtualKeyboard=false

# Branding settings
showLogo=true
logo=assets/logos/origin_logo.png
logoWidth=230
logoScale=1.0

# Top-Left controls
showTopLeftControls=true
showAgeRating=true
textRepair=Sửa nhanh
textAuxiliary=5v5 offline

# Bottom buttons & text
textQuickLoginPrefix=Tiếp tục với
textLastLoginSubtitle=Lần đăng nhập cuối
textSwitchAccount=Đổi tài khoản
textPasswordLogin=Đăng nhập mật khẩu
textEnterPasswordPlaceholder=Nhập mật khẩu...
textAuthenticating=Đang xác thực...
textLoginFailed=Mật khẩu không chính xác hoặc xác thực thất bại!
textCapslockWarning=Phím Caps Lock đang bật!

# Terms & Info row
showTerms=true
termsText=Tôi đã đọc kỹ và đồng ý 
termsLinkText=Điều khoản
termsRequired=false
versionText=4078584025384049

# Theme colors & fonts
fontFamily=Orbitron, Noto Sans, Liberation Sans, sans-serif
fontSize=11
primaryBlue=#3875cf
goldAccent=#cd975d
cyanGlow=#38bdf8
windowBackground=#0b0e26

# Account privilege mappings
sudoAccounts=loliconhihi,duckneee,bocuawin0608,dotfile-test
offlineAccount=guest

