<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0e7ff"/>
      <stop offset="70%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="crestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <g filter="url(#crestGlow)">
    <!-- Outer diamond / crystal facets -->
    <path d="M50 8 L85 45 L50 112 L15 45 Z" fill="none" stroke="url(#crestGrad)" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Left shard -->
    <path d="M50 16 L30 45 L50 95 L42 45 Z" fill="url(#crestGrad)" opacity="0.95"/>
    <!-- Right shard -->
    <path d="M50 16 L70 45 L50 95 L58 45 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Central slit / radiance -->
    <polygon points="50,22 47,45 50,88 53,45" fill="#ffffff"/>
    <circle cx="50" cy="45" r="4" fill="#67e8f9"/>
  </g>
</svg>